name: Publish to npm

# Publishes the package to npm when a GitHub Release is published, or on a
# manual dispatch. The release tag (e.g. v0.2.1) must match the version in
# package.json — the workflow checks this before publishing so a mistagged
# release fails fast instead of shipping the wrong version.
#
# Requires the NPM_TOKEN repository secret: an npm automation token with
# publish rights on @edd_remonts. Without it the run stops at the auth check
# with an explanation rather than a bare ENEEDAUTH from the registry.
#
# pnpm comes from the `packageManager` field so CI uses the version that wrote
# pnpm-lock.yaml; a mismatch there is the usual cause of --frozen-lockfile
# failing only in CI.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Release tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build

      # `build` ends with verify-dist, but run it on its own so a packaging
      # regression is reported as its own failed step rather than buried in
      # the build log.
      - run: pnpm verify:dist

      - name: Check the version is not already on npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already published — bump the version first."
            exit 1
          fi
          echo "$NAME@$VERSION is not on npm yet."

      - name: Check the npm token is present
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::The NPM_TOKEN repository secret is not set. Create an npm automation token with publish rights on @edd_remonts, then run: gh secret set NPM_TOKEN"
            exit 1
          fi

      # The token is appended to the PROJECT .npmrc, which wins over the
      # userconfig that actions/setup-node writes. Two things had to be got
      # right here:
      #  - pnpm does not expand environment variables in .npmrc, so setup-node's
      #    `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` reached the
      #    registry as that literal string and every publish went out
      #    unauthenticated. npm answers an unauthenticated PUT on an existing
      #    package with 404 rather than 401, so it read as a permissions problem.
      #  - `pnpm config set` writes pnpm's own config file, which is not the
      #    npmrc pnpm then reads for auth, so it did not help either.
      # `pnpm whoami` runs first so an auth failure says so directly.
      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          printf '\n//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >> .npmrc
          pnpm whoami
          pnpm publish --no-git-checks --access public
