name: Publish to npm

# Publishes the package to npm when a GitHub Release is published, or on a
# manual dispatch. The release tag (e.g. v0.2.1) must match the version in
# package.json — the workflow checks this before publishing so a mistagged
# release fails fast instead of shipping the wrong version.
#
# Requires the NPM_TOKEN repository secret: an npm automation token with
# publish rights on @edd_remonts. Without it the run stops at the auth check
# with an explanation rather than a bare ENEEDAUTH from the registry.
#
# pnpm comes from the `packageManager` field so CI uses the version that wrote
# pnpm-lock.yaml; a mismatch there is the usual cause of --frozen-lockfile
# failing only in CI.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Required for Trusted Publishing: npm verifies a short-lived OIDC token
  # minted by GitHub for this workflow instead of a long-lived secret.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Release tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build

      # `build` ends with verify-dist, but run it on its own so a packaging
      # regression is reported as its own failed step rather than buried in
      # the build log.
      - run: pnpm verify:dist

      - name: Check the version is not already on npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already published — bump the version first."
            exit 1
          fi
          echo "$NAME@$VERSION is not on npm yet."

      # Not fatal any more: Trusted Publishing is the primary credential and
      # needs no secret. This only records which path the run will take, so a
      # later failure is easy to read.
      - name: Report the credential path
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN is set; it will be used if OIDC is unavailable."
          else
            echo "No NPM_TOKEN. Publishing relies on Trusted Publishing (OIDC)."
            echo "If that fails, register a trusted publisher for this package on npmjs.com"
            echo "naming eddremonts86/ai-schadcn-chat and .github/workflows/publish.yml."
          fi

      # Trusted Publishing. npm mints the credential from this workflow's OIDC
      # identity, so there is no token to store, rotate or leak — which also
      # sidesteps npm removing direct publish from bypass-2FA granular tokens
      # in January 2027. Requires `id-token: write` above, npm 11.5.1+, and a
      # trusted publisher registered for the package on npmjs.com naming this
      # repository and this workflow file.
      #
      # NPM_TOKEN stays wired as a fallback: if the secret is present it is
      # written to the project .npmrc, and npm uses it when OIDC is unavailable.
      # Publishing with pnpm is deliberately avoided — it routes the version
      # through npm's staging area while reporting "Published", which is what
      # made 0.2.1 unusable.
      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@latest
          if [ -n "$NPM_TOKEN" ]; then
            printf '\n//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >> .npmrc
          fi
          npm publish --access public
