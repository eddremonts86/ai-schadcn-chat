name: Publish to npm

# Publishes the package to npm when a GitHub Release is published, or on a
# manual dispatch. The release tag (e.g. v0.2.1) must match the version in
# package.json — the workflow checks this before publishing so a mistagged
# release fails fast instead of shipping the wrong version.
#
# Credentials come from npm Trusted Publishing: npm verifies a short-lived
# OIDC token minted by GitHub for this workflow, so there is no secret to
# store, rotate or leak. The package must have a trusted publisher registered
# on npmjs.com naming this repository and this workflow file.
#
# pnpm comes from the `packageManager` field so CI uses the version that wrote
# pnpm-lock.yaml; a mismatch there is the usual cause of --frozen-lockfile
# failing only in CI.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # Required for Trusted Publishing: npm verifies a short-lived OIDC token
  # minted by GitHub for this workflow instead of a long-lived secret.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        if: github.event_name == 'release'
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Release tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm build

      # `build` ends with verify-dist, but run it on its own so a packaging
      # regression is reported as its own failed step rather than buried in
      # the build log.
      - run: pnpm verify:dist

      - name: Check the version is not already on npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          NAME="$(node -p "require('./package.json').name")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already published — bump the version first."
            exit 1
          fi
          echo "$NAME@$VERSION is not on npm yet."


      # Trusted Publishing. npm mints the credential from this workflow's OIDC
      # identity, so there is no token to store, rotate or leak — which also
      # sidesteps npm removing direct publish from bypass-2FA granular tokens
      # in January 2027. Requires `id-token: write` above, npm 11.5.1+, and a
      # trusted publisher registered for the package on npmjs.com naming this
      # repository and this workflow file.
      #
      # No token is written at all, so a green run here is proof the trusted
      # publisher is doing the work. --provenance records where the tarball was
      # built, which OIDC makes possible.
      #
      # Publishing with pnpm is deliberately avoided — it routes the version
      # through npm's staging area while reporting "Published", which is what
      # made 0.2.1 unusable.
      - name: Publish
        run: |
          npm install -g npm@latest
          npm publish --access public --provenance
